# /etc/nginx/sites-enabled/uat.salemtamilroots.in
#
# UAT with BOTH frontends and a switch between them:
#   - str_ui cookie = "modern" -> home page and product links show the new storefront (salemtamilroots_web)
#   - no cookie / "legacy"     -> everything is the current frontend, exactly as before
#   - /switch-ui/modern and /switch-ui/legacy set the cookie
#   - legacy pages get a "Try the new site" button injected by nginx (no change to the old repo)
# The API, product images and Swagger are unchanged.

# The app runs with --hostname localhost. Depending on /etc/hosts, Node binds that to ::1 (Ubuntu 24.04
# on this VPS) or 127.0.0.1, so list both; nginx uses the backup only if the first is not listening.
upstream str_web_uat {
    server [::1]:3102;
    server 127.0.0.1:3102 backup;
}

map $cookie_str_ui $str_ui_modern {
    default 0;
    modern  1;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name uat.salemtamilroots.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name uat.salemtamilroots.in;

    root /opt/uat/salemtamilroots_frontend;
    index index.html;
    client_max_body_size 10M;

    # ---------- switch between the two sites ----------
    location = /switch-ui/modern {
        add_header Set-Cookie "str_ui=modern; Path=/; Max-Age=2592000; SameSite=Lax; Secure; HttpOnly";
        return 302 /;
    }
    location = /switch-ui/legacy {
        add_header Set-Cookie "str_ui=legacy; Path=/; Max-Age=2592000; SameSite=Lax; Secure; HttpOnly";
        return 302 /;
    }

    # Home page: new or legacy, by cookie
    location = / {
        if ($str_ui_modern) { rewrite ^ /__modern/ last; }
        sub_filter_once on;
        sub_filter '</body>' '<a href="/switch-ui/modern" style="position:fixed;left:16px;bottom:16px;z-index:99999;background:#084422;color:#fff;font:600 14px/1 system-ui,sans-serif;padding:12px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);text-decoration:none">UAT &middot; Try the new site</a></body>';
        try_files /index.html =404;
    }
    location = /index.html { return 301 /; }

    # Old product links open the new product page when "modern" is chosen
    location = /product_details.html {
        if ($str_ui_modern) { return 302 /products/$arg_slug; }
        sub_filter_once on;
        sub_filter '</body>' '<a href="/switch-ui/modern" style="position:fixed;left:16px;bottom:16px;z-index:99999;background:#084422;color:#fff;font:600 14px/1 system-ui,sans-serif;padding:12px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);text-decoration:none">UAT &middot; Try the new site</a></body>';
        try_files $uri =404;
    }

    # Internal hop used by "location = /" above
    location ^~ /__modern/ {
        internal;
        proxy_pass http://str_web_uat/;
        include snippets/next-proxy.conf;
    }

    # Pages and files that only exist in the new storefront (always served by it)
    location = /ta            { proxy_pass http://str_web_uat; include snippets/next-proxy.conf; }
    location ^~ /ta/          { proxy_pass http://str_web_uat; include snippets/next-proxy.conf; }
    location ^~ /products/    { proxy_pass http://str_web_uat; include snippets/next-proxy.conf; }
    location = /cart          { proxy_pass http://str_web_uat; include snippets/next-proxy.conf; }
    location ^~ /_next/       { proxy_pass http://str_web_uat; include snippets/next-proxy.conf; }
    location ^~ /brand/       { proxy_pass http://str_web_uat; include snippets/next-proxy.conf; }
    location ^~ /sample/      { proxy_pass http://str_web_uat; include snippets/next-proxy.conf; }

    # ---------- current frontend (legacy), as before ----------
    location / {
        sub_filter_once on;
        sub_filter '</body>' '<a href="/switch-ui/modern" style="position:fixed;left:16px;bottom:16px;z-index:99999;background:#084422;color:#fff;font:600 14px/1 system-ui,sans-serif;padding:12px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);text-decoration:none">UAT &middot; Try the new site</a></body>';
        try_files $uri $uri/ /index.html;
    }

    # Product images from the backend (unchanged)
    location /assets/images/ {
        alias /opt/uat/salemtamilroots_backend/SalemTamilRoots/wwwroot/assets/images/;
    }

    # API (unchanged)
    location /api {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI (unchanged)
    location /swagger {
        proxy_pass http://127.0.0.1:5001;
    }

    ssl_certificate /etc/letsencrypt/live/uat.salemtamilroots.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat.salemtamilroots.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
