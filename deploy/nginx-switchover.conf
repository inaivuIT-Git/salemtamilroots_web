# PRODUCTION (later). For UAT use deploy/uat/nginx-uat.salemtamilroots.in.conf, which also has the
# modern/legacy switch. Add inside the existing server { } block for salemtamilroots.in.
# Only the paths listed here go to the new storefront; everything else keeps going to the
# current frontend files and /api keeps going to the .NET API, exactly as today.
# Remove these blocks and reload nginx to roll back instantly.
#
# Put this upstream in http context (top of the site file, outside server { }):
#   upstream str_web { server [::1]:3101; server 127.0.0.1:3101 backup; }
# (the app binds "localhost", which Node may resolve to ::1 or 127.0.0.1)

location = /                { proxy_pass http://str_web; include snippets/next-proxy.conf; }
location = /ta              { proxy_pass http://str_web; include snippets/next-proxy.conf; }
location /ta/               { proxy_pass http://str_web; include snippets/next-proxy.conf; }
location /products/         { proxy_pass http://str_web; include snippets/next-proxy.conf; }
location = /cart            { proxy_pass http://str_web; include snippets/next-proxy.conf; }
location /_next/            { proxy_pass http://str_web; include snippets/next-proxy.conf; }
location /brand/            { proxy_pass http://str_web; include snippets/next-proxy.conf; }

# Old addresses of pages that now live in the new storefront
location = /index.html      { return 301 /; }

