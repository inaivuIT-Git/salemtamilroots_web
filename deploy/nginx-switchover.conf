# Add inside the existing server { } block for the site (uat.salemtamilroots.in first).
# Only the paths listed here go to the new storefront; everything else keeps going to the
# current frontend files and /api keeps going to the .NET API, exactly as today.
# Remove these blocks and reload nginx to roll back instantly.

location = /                { proxy_pass http://127.0.0.1:3101; include snippets/next-proxy.conf; }
location = /ta              { proxy_pass http://127.0.0.1:3101; include snippets/next-proxy.conf; }
location /ta/               { proxy_pass http://127.0.0.1:3101; include snippets/next-proxy.conf; }
location /products/         { proxy_pass http://127.0.0.1:3101; include snippets/next-proxy.conf; }
location = /cart            { proxy_pass http://127.0.0.1:3101; include snippets/next-proxy.conf; }
location /_next/            { proxy_pass http://127.0.0.1:3101; include snippets/next-proxy.conf; }
location /brand/            { proxy_pass http://127.0.0.1:3101; include snippets/next-proxy.conf; }

# Old addresses of pages that now live in the new storefront
location = /index.html      { return 301 /; }

